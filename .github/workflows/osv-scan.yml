name: osv-scan

# Reusable dependency scanning for bounded-systems (infra#104).
#
# WHY THIS REPO IS PUBLIC, AND WHY IT IS NOT `infra`:
# Private-repo workflows and actions never resolve into public callers — no org setting
# overrides it. That constraint already forced the approval gate out of `infra` and into
# its own public repo (`bounded-systems/await-approval`, infra#101, observed on
# front-desk run 30562621239). With ~87 public repos to cover, this workflow has to live
# somewhere public too.
#
# WHY NOT google/osv-scanner-action:
# The proofs lane learned this the hard way. A third-party action can invoke NESTED
# actions by tag (lean-action → actions/cache/restore@v5), which the org's full-SHA-pin
# Actions policy rejects — and SHA-pinning the parent cannot exempt its children. A
# release binary has no children.
#
# WHY A REUSABLE WORKFLOW RATHER THAN AN APP:
# No vendor account, no API key, no installed App — zero standing grants added to the
# org. That property is what made this beat all three options weighed in infra#90.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the scan job.
        type: string
        default: ubuntu-latest
      scan-path:
        description: Directory to scan, relative to the repository root.
        type: string
        default: "."
      ref:
        description: >-
          Ref to check out. Defaults to the commit that triggered the caller, which is
          what you want; set it only when scanning something other than the caller's ref.
        type: string
        default: ""
      report-only:
        description: >-
          Downgrade VULNERABILITY findings from a hard failure to a warning. This is an
          ADOPTION GRACE SETTING, not a posture choice: a repo with pre-existing
          advisories can adopt the lane immediately (so it is instrumented and its
          findings are visible) and clear them as separate work, instead of adoption and
          remediation being the same blocking task. Remove it once the repo is clean.
          Tool and network failures still fail hard regardless — see the scan step.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deps:
    name: osv-scan
    runs-on: ${{ inputs.runs-on }}
    steps:
      # Same pin as the org's .github/repo-standard.yml and required-baseline.yml, so
      # there is one checkout SHA to bump across the org rather than two.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The version and the digest are deliberately NOT inputs. They are a matched pair:
      # a caller that could override the version would silently break the digest check,
      # and a caller that could override the digest could disable it entirely. Bumping
      # the scanner is an edit to this file, reviewed once, inherited by every caller.
      #
      # Provenance for this digest — re-derived 2026-07-30 per infra#104, which recorded
      # the original as "pinned to what we saw" because it was captured through a
      # TLS-intercepting proxy. Upstream publishes no checksums.txt, but it DOES publish
      # a SLSA provenance bundle, which is strictly stronger:
      #
      #   https://github.com/google/osv-scanner/releases/download/v2.4.0/multiple.intoto.jsonl
      #
      # That bundle's DSSE signature verifies against its embedded Fulcio certificate,
      # and the signed statement lists this exact digest as the subject for
      # osv-scanner_linux_amd64. The signing identity is:
      #
      #   SAN         slsa-framework/slsa-github-generator/.github/workflows/
      #                 generator_generic_slsa3.yml@refs/tags/v2.1.0
      #   OIDC issuer https://token.actions.githubusercontent.com
      #   source      github.com/google/osv-scanner @ refs/tags/v2.4.0
      #   commit      b56b5191101d5f27d4787d5583d8d01e9518a7af
      #   build       google/osv-scanner/actions/runs/27762425209
      #
      # Residual gap, stated plainly: the certificate was not chained to the Sigstore
      # root out-of-band, and Rekor is unreachable from the session that verified this
      # (egress policy), so the transparency-log inclusion proof was NOT checked. The
      # recipe in the repo README reproduces the check anywhere with open egress.
      - name: Install osv-scanner v2.4.0 (digest-pinned)
        env:
          OSV_VERSION: v2.4.0
          OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
        run: |
          set -euo pipefail
          curl -sSfL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  /usr/local/bin/osv-scanner" | sha256sum -c -
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      # deno.lock has no osv-scanner extractor (see the coverage note below), but a
      # v4/v5 lock already CONTAINS the fully-resolved npm graph — Deno's npm-compat
      # layer did the resolution. This step re-encodes that npm subset as a CycloneDX
      # SBOM next to each lock; the scan step's directory walk then picks the SBOMs up
      # by filename, no scanner flags needed. JSR-native deps and @jsr/* npm-compat
      # mirrors are deliberately excluded — OSV has no JSR ecosystem and no advisory
      # can exist for npm.jsr.io-served packages under an npm purl, so including them
      # would inflate the "scanned" count without adding coverage. Each lock logs its
      # three bucket counts so a green check states its own blind spot.
      #
      # The python below is EMBEDDED because a reusable workflow's steps run in the
      # CALLER's checkout — this repo's tools/ directory is not on disk there. The
      # same bytes are tracked as tools/deno-lock-cdx.py for tests, and self-test
      # fails if the two copies drift (test/check_embed_sync.py) — same
      # keep-the-copies-honest pattern as infra's proofs/check-sync.mjs.
      - name: Convert deno.lock npm subsets to scannable SBOMs
        working-directory: ${{ inputs.scan-path }}
        run: |
          set -euo pipefail
          while IFS= read -r lock; do
            out="$(dirname "$lock")/deno-lock.cdx.json"
            if [ -e "$out" ]; then
              echo "::error::$out already exists - refusing to overwrite a tracked file"
              exit 1
            fi
            python3 - "$lock" "$out" <<'PY'
          #!/usr/bin/env python3
          # deno.lock (v4/v5) -> CycloneDX 1.5 SBOM, npm-registry subset only.
          #
          # This is a PURE FUNCTION with a file interface: the same deno.lock bytes must
          # produce byte-identical SBOM output, forever, on any machine. That is why there
          # is no timestamp, no random serialNumber (both optional in CycloneDX; the usual
          # UUID default is exactly the nondeterminism this refuses), components are
          # sorted, and json.dumps uses sort_keys with fixed indentation. The golden tests
          # in test/ enforce byte-equality; do not add anything environment-dependent.
          #
          # Three buckets, reported honestly (osv-scanner reads the SBOM this writes):
          #   npm-registry deps        -> included: OSV's npm ecosystem can match them
          #   @jsr/* npm-compat deps   -> EXCLUDED: served from npm.jsr.io, not npmjs.
          #                               No OSV advisory can exist under that purl, so
          #                               including them would inflate the "scanned" count
          #                               without adding coverage.
          #   jsr-native deps          -> EXCLUDED: OSV has no JSR ecosystem.
          # The one-line summary this prints per lock is the lane's honesty about that.
          #
          # stdlib only, deliberately: nothing to install, nothing to SHA-pin beyond what
          # the lane already pins, and `nix flake check` runs the identical tests locally.
          import json
          import re
          import sys
          from urllib.parse import quote

          # npm/jsr section keys look like "name@version" with an optional "_peer@ver..."
          # suffix for peer-dependency variants. Names may be scoped (@scope/pkg) and may
          # contain "__" (JSR's npm-compat mangling); versions are semver, which never
          # contains "_". The name cannot contain "@" after its optional leading one.
          KEY = re.compile(r"^(@?[^@]+)@([^_]+)(?:_.*)?$")


          def parse_key(key):
              m = KEY.match(key)
              if not m:
                  raise ValueError(f"unparseable lock key: {key!r}")
              return m.group(1), m.group(2)


          def purl(name, version):
              # purl spec: '@' in scope and any '+' in version must be percent-encoded;
              # the '/' between scope and name stays literal.
              path = "/".join(quote(seg, safe="") for seg in name.split("/"))
              return f"pkg:npm/{path}@{quote(version, safe='')}"


          def convert(lock):
              version = str(lock.get("version", ""))
              if version not in ("4", "5"):
                  return None, None, version
              covered = []
              jsr_compat = 0
              seen = set()
              for key in lock.get("npm", {}) or {}:
                  name, ver = parse_key(key)
                  if name.startswith("@jsr/"):
                      jsr_compat += 1
                      continue
                  if (name, ver) in seen:  # peer-variant keys collapse to one component
                      continue
                  seen.add((name, ver))
                  covered.append((name, ver))
              covered.sort()
              sbom = {
                  "bomFormat": "CycloneDX",
                  "specVersion": "1.5",
                  "version": 1,
                  "components": [
                      {
                          "bom-ref": purl(n, v),
                          "name": n,
                          "purl": purl(n, v),
                          "type": "library",
                          "version": v,
                      }
                      for n, v in covered
                  ],
              }
              counts = {
                  "npm_registry": len(covered),
                  "jsr_via_npm_compat": jsr_compat,
                  "jsr_native": len(lock.get("jsr", {}) or {}),
              }
              return sbom, counts, version


          def main(argv):
              if len(argv) != 3:
                  print("usage: deno-lock-cdx.py <deno.lock> <out.cdx.json>", file=sys.stderr)
                  return 2
              lock_path, out_path = argv[1], argv[2]
              with open(lock_path) as f:
                  lock = json.load(f)
              sbom, counts, version = convert(lock)
              if sbom is None:
                  # Visible on the run summary, deliberately non-fatal: an old-format lock
                  # was previously scanned as nothing at all, and turning that into a hard
                  # red would make adoption force lock migrations. Loud, not blocking.
                  print(
                      f"::warning::{lock_path}: unsupported deno.lock version {version!r} "
                      "(expected 4 or 5) - not converted, npm subset NOT scanned"
                  )
                  return 0
              summary = (
                  f"{lock_path}: npm-registry={counts['npm_registry']} (scanned), "
                  f"jsr-via-npm-compat={counts['jsr_via_npm_compat']}, "
                  f"jsr-native={counts['jsr_native']} (NOT scanned - no OSV ecosystem)"
              )
              if counts["npm_registry"] == 0:
                  print(summary + " -- nothing scannable, no SBOM written")
                  return 0
              with open(out_path, "w") as f:
                  f.write(json.dumps(sbom, indent=2, sort_keys=True) + "\n")
              print(summary)
              return 0


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv))
          PY
          done < <(find . -name deno.lock -not -path '*/node_modules/*' -not -path '*/.git/*' | sort)

      # `scan source -r` walks the tree and picks its own extractors, rather than
      # `find`-ing package-lock.json the way infra's inline job does. That matters here:
      # infra has one npm lockfile, but the ~90 repos this fans out to are a mix of npm,
      # Cargo, Go, Python and Maven, and a hardcoded npm-only find would silently report
      # "nothing to scan" on every one of them.
      #
      # NOT covered: deno.lock. osv-scanner 2.4.0 ships no extractor for it — an explicit
      # `--lockfile=deno.lock` fails with "could not determine extractor suitable to this
      # file". Deno-first repos in this org are therefore scanned only for whatever OTHER
      # manifests they carry, and a green check here does NOT mean their JSR/npm graph
      # was examined. Tracked in infra#104.
      #
      # --allow-no-lockfiles: a repo with nothing scannable is a pass, not a failure. That
      # is the common case across the org and must not read as a broken lane.
      - name: Scan dependencies for known vulnerabilities
        working-directory: ${{ inputs.scan-path }}
        env:
          REPORT_ONLY: ${{ inputs.report-only }}
        run: |
          set -uo pipefail
          # `set +e` is LOAD-BEARING, not redundant. GitHub invokes run steps as
          # `bash -e {0}` — errexit arrives on the COMMAND LINE, so a `set -uo pipefail`
          # here leaves it on, and the shell would exit the moment osv-scanner returns 1,
          # never reaching the triage below. That is exactly the bug this replaced: the
          # grace flag silently did nothing because the script died before reading it.
          set +e
          # Default posture is HARD-FAIL: exit 1 means vulnerabilities were found and the
          # lane goes red.
          #
          # The exit codes are triaged rather than propagated, because `report-only` must
          # NOT be able to hide a broken lane. osv-scanner exits 1 for "vulnerabilities
          # found"; anything else non-zero is a tool, network or usage failure. Only the
          # former is downgradable — a scanner that could not run must fail loudly in
          # every mode, or an adopting repo would show a reassuring green check while
          # scanning nothing. That distinction is the whole reason this is not a bare
          # `continue-on-error: true` on the step.
          #
          # Escape hatch for an accepted or unfixable finding: commit an `osv-scanner.toml`
          # next to the lockfile with an [[IgnoredVulns]] entry. It is picked up
          # automatically, is reviewed like any other diff, and leaves a written reason in
          # the tree instead of a silently weakened lane.
          osv-scanner scan source -r --allow-no-lockfiles .
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          elif [ "$rc" -eq 1 ]; then
            if [ "${REPORT_ONLY}" = "true" ]; then
              echo "::warning::Known vulnerabilities found. This repo runs the scan lane in"\
                   "report-only adoption grace, so the check is NOT failing. See the table"\
                   "above, fix them, then drop 'report-only: true' from .github/workflows/deps.yml."
              exit 0
            fi
            exit 1
          else
            echo "::error::osv-scanner exited $rc — this is a tool or network failure, not a"\
                 "clean scan. Failing regardless of report-only: a lane that cannot run must"\
                 "never report green."
            exit "$rc"
          fi
