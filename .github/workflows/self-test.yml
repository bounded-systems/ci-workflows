name: self-test

# ci-workflows carries no real lockfiles of its own, so the scan job does not prove much
# about vulnerability detection. It proves the things that actually break in the field
# and that would otherwise break for ~87 callers at once:
#
#   1. the release URL still serves, and the pinned digest still matches
#      (an upstream re-tag or a silently replaced asset fails here first, not downstream);
#   2. the `--allow-no-lockfiles` path exits 0 rather than red-lining a repo with
#      nothing scannable — the common case across this org;
#   3. the deno.lock convert step runs end-to-end: the synthetic fixture lock under
#      test/fixtures/ is found, converted, and its SBOM scanned. The fixture's package
#      names are made up, so no real-world advisory can ever redden this lane for
#      reasons unrelated to the lane itself.
#
# The converter job guards the converter the same way goldens guard any pure function:
# byte-equality against fixtures, plus a drift check that the copy embedded in
# osv-scan.yml is byte-identical to tools/deno-lock-cdx.py. `nix flake check` runs the
# same two scripts locally — one test suite, two runners.
#
# The weekly schedule is the point: a digest drift discovered on a Monday cron is one
# red check here, whereas the same drift discovered organically is every adopting repo
# going red on the same morning.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: ./.github/workflows/osv-scan.yml

  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Converter unit + golden tests (byte-equality)
        run: python3 test/test_converter.py
      - name: Embedded copy in osv-scan.yml matches tools/deno-lock-cdx.py
        run: python3 test/check_embed_sync.py
      # Runs the scan step's triage under `bash -e`, the way GitHub actually invokes
      # run steps. A prior version of the triage assumed errexit was off and the
      # report-only flag silently did nothing on every caller; a local test that used
      # plain `bash` passed anyway. This is that gap, closed.
      - name: Scan posture — exit-code triage under bash -e
        run: python3 test/test_scan_posture.py
