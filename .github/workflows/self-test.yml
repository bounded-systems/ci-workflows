name: self-test

# ci-workflows carries no real lockfiles of its own, so the scan job does not prove much
# about vulnerability detection. It proves the things that actually break in the field
# and that would otherwise break for ~87 callers at once:
#
#   1. the release URL still serves, and the pinned digest still matches
#      (an upstream re-tag or a silently replaced asset fails here first, not downstream);
#   2. the `--allow-no-lockfiles` path exits 0 rather than red-lining a repo with
#      nothing scannable — the common case across this org;
#   3. the deno.lock convert step runs end-to-end: the synthetic fixture lock under
#      test/fixtures/ is found, converted, and its SBOM scanned. The fixture's package
#      names are made up, so no real-world advisory can ever redden this lane for
#      reasons unrelated to the lane itself.
#
# The converter job guards the converter the same way goldens guard any pure function:
# byte-equality against fixtures, plus a drift check that the copy embedded in
# osv-scan.yml is byte-identical to tools/deno-lock-cdx.py. `nix flake check` runs the
# same two scripts locally — one test suite, two runners.
#
# The weekly schedule is the point: a digest drift discovered on a Monday cron is one
# red check here, whereas the same drift discovered organically is every adopting repo
# going red on the same morning.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: ./.github/workflows/osv-scan.yml

  # Exercises env-check-drift.yml end to end against this repo's own canonical file.
  # ci-workflows has no .claude/hooks/ of its own, so `path` points at tools/ — the
  # bytes are the same ones every caller is measured against, so a pass here means the
  # workflow runs, finds the file, hashes it, and agrees with its own pin. A digest
  # bumped in only one of the two places fails in `env-check-digest` below; a workflow
  # that cannot run at all fails here.
  env-check:
    uses: ./.github/workflows/env-check-drift.yml
    with:
      path: tools/cloud-env-check.mjs

  env-check-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: CANONICAL_SHA256 in env-check-drift.yml matches tools/cloud-env-check.mjs
        run: python3 test/check_env_check_digest.py

  # Resolves the SHAs in templates/ against real commits. The COMPLEMENT of
  # check_template_pins.py, not a duplicate — see that script's header for the split.
  # Shape is checkable offline and runs in both runners; resolution needs git history,
  # which `nix flake check` cannot provide (store path, no .git, no network).
  #
  # Closes the fourth hollow green in infra's docs/cloud-sessions.md: self-test once
  # passed on a commit whose reusable-workflow pin was a nonexistent SHA. A template is
  # copied verbatim into adopters, so a bad pin never fails here — it fails in every
  # repo that adopts it, long after anyone connects it to this commit.
  #
  # fetch-depth: 0 is load-bearing. Under the default shallow checkout EVERY cat-file
  # fails and this job red-lines on correct pins — loud rather than silent, but still
  # wrong, and the fix is history, not deleting the check.
  #
  # Scope: templates/ currently pins only this repo's own workflows, so local history
  # resolves everything. A third-party pin would need `git ls-remote` (network, and a
  # different failure posture) — worth noticing before adding one, rather than
  # discovering it when this job goes mysteriously red.
  template-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Template pins are well-formed (shape)
        run: python3 test/check_template_pins.py
      - name: Template pins resolve to real commits
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r line; do
            slug="${line#*uses: }"; slug="${slug%@*}"
            sha="${line#*@}"; sha="${sha%% *}"
            # Only this repo's own pins resolve from local history. Anything else is
            # reported rather than silently passed.
            case "$slug" in
              bounded-systems/ci-workflows/*) ;;
              *) echo "::warning::$slug@$sha is not a ci-workflows pin — not resolvable from local history"; continue ;;
            esac
            if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "✓ $sha  $(git log --format=%s -1 "$sha")"
            else
              echo "::error::$sha names no commit in this repository ($slug)"
              rc=1
            fi
          done < <(grep -rh "uses:.*@" templates/*.yml)
          if [ "$rc" -ne 0 ]; then
            echo "::error::A template pin names no real commit. Derive SHAs with 'git rev-parse', never by hand."
            exit 1
          fi

  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Converter unit + golden tests (byte-equality)
        run: python3 test/test_converter.py
      - name: Embedded copy in osv-scan.yml matches tools/deno-lock-cdx.py
        run: python3 test/check_embed_sync.py
      # Runs the scan step's triage under `bash -e`, the way GitHub actually invokes
      # run steps. A prior version of the triage assumed errexit was off and the
      # report-only flag silently did nothing on every caller; a local test that used
      # plain `bash` passed anyway. This is that gap, closed.
      - name: Scan posture — exit-code triage under bash -e
        run: python3 test/test_scan_posture.py
